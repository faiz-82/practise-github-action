name: "Inputs Pipeline"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run against'
        required: true
        type: choice
        default: main
        options:
          - main
          - develop
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - infoa
        - warning
        - debuga
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

jobs:
  log-the-inputs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log level: $LEVEL"
          echo "Tags: $TAGS"
          echo "Environment: $ENVIRONMENT"
        env:
          LEVEL: ${{ inputs.logLevel }}
          TAGS: ${{ inputs.tags }}
          ENVIRONMENT: ${{ inputs.environment }}
